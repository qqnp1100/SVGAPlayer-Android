        [[&#x27;文件读取 / 解析&#x27;,&#x27;单次图像素与池实例独立&#x27;],[&#x27;准备：23 张常驻图 + 预热&#x27;,&#x27;当前帧与后续 3 帧窗口&#x27;],[&#x27;前台播放  /  后台预取&#x27;,&#x27;已就绪帧不等待预取锁&#x27;],[&#x27;移窗 → 提交后复用旧图&#x27;,&#x27;缺帧才暂停；完成即恢复时钟&#x27;]]
      ];
      let pass = 0;
      const saved = window.openai?.widgetState?.privateContent;
      if (saved?.comparisonPass === 1) pass = 1;
      select.value = String(pass);
      function el(tag, attrs = {}, text) {
        const n = document.createElementNS(ns, tag);
        for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, String(v));
        if (text !== undefined) n.textContent = text;
        return n;
      }
      function addText(svg,x,y,text,anchor=&#x27;start&#x27;,extra={}) {
        const n = el(&#x27;text&#x27;,{x,y,&#x27;text-anchor&#x27;:anchor,...extra},text); svg.appendChild(n); return n;
      }
      function drawFlow(svg,index) {
        const w = Math.max(240, svg.parentElement.getBoundingClientRect().width);
        const h = 318; svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${h}`); svg.style.height=`${h}px`; svg.replaceChildren();
        const nodeX=6, nodeW=w-12, boxH=56, step=78;
        flowData[index].forEach((lines,i) =&gt; {
          const y=5+i*step;
          if(index===2 &amp;&amp; i===2){
            const gap=12,cw=(nodeW-gap)/2;
            [[&#x27;就绪帧绘制&#x27;,&#x27;不等预取锁&#x27;],[&#x27;后续帧解码&#x27;,&#x27;后台预取&#x27;]].forEach((labels,j)=&gt;{
              const cx=nodeX+j*(cw+gap);
              svg.appendChild(el(&#x27;rect&#x27;,{x:cx,y,width:cw,height:boxH,rx:6,class:&#x27;node&#x27;}));
              addText(svg,cx+cw/2,y+23,labels[0],&#x27;middle&#x27;);
              addText(svg,cx+cw/2,y+43,labels[1],&#x27;middle&#x27;);
            });
          }else{
            svg.appendChild(el(&#x27;rect&#x27;,{x:nodeX,y,width:nodeW,height:boxH,rx:6,class:&#x27;node&#x27;}));
            addText(svg,w/2,y+23,lines[0],&#x27;middle&#x27;);
            addText(svg,w/2,y+43,lines[1],&#x27;middle&#x27;);
          }
          if (i&lt;3) {
            if(index===2 &amp;&amp; i===1){
              const cw=(nodeW-12)/2, yy=y+boxH+2;
              for(const cx of [nodeX+cw/2,nodeX+cw+12+cw/2]) svg.appendChild(el(&#x27;path&#x27;,{d:`M ${w/2} ${yy} V ${yy+7} H ${cx} V ${yy+16} m -4 -4 l 4 4 l 4 -4`,class:&#x27;edge&#x27;}));
            }else if(index===2 &amp;&amp; i===2){
              const cw=(nodeW-12)/2, yy=y+boxH+2;
              for(const cx of [nodeX+cw/2,nodeX+cw+12+cw/2]) svg.appendChild(el(&#x27;path&#x27;,{d:`M ${cx} ${yy} V ${yy+7} H ${w/2}`,class:&#x27;edge&#x27;}));
              svg.appendChild(el(&#x27;path&#x27;,{d:`M ${w/2} ${yy+7} V ${yy+16} m -4 -4 l 4 4 l 4 -4`,class:&#x27;edge&#x27;}));
            }else svg.appendChild(el(&#x27;path&#x27;,{d:`M ${w/2} ${y+boxH+2} v 16 m -4 -4 l 4 4 l 4 -4`,class:&#x27;edge&#x27;}));
          }
        });
      }
      function drawPlot(svg,type) {
        const w = Math.max(240, svg.parentElement.getBoundingClientRect().width);
        const h = 260, left=64, right=52, top=25, bottom=218, pw=w-left-right;
        svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${h}`); svg.style.height=`${h}px`; svg.replaceChildren();
        const values=modes.map(m=&gt;type===&#x27;time&#x27;?m.load[pass]+m.play[pass]:type===&#x27;memory&#x27;?m.pss:m.cpuLoad[pass]+m.cpuPlay[pass]);
        const ceiling=Math.max(...values)*1.18;
        const x=v=&gt;left+v/ceiling*pw;
        svg.setAttribute(&#x27;aria-label&#x27;,type===&#x27;time&#x27;?&#x27;准备与播放耗时，单位秒&#x27;:type===&#x27;memory&#x27;?&#x27;进程PSS峰值和Bitmap峰值，单位MiB&#x27;:&#x27;准备和播放阶段累计进程CPU时间，单位CPU秒&#x27;);
        svg.appendChild(el(&#x27;rect&#x27;,{x:left,y:top,width:pw,height:bottom-top,class:&#x27;plot-frame&#x27;,&#x27;data-chart-frame&#x27;:&#x27;&#x27;}));
        for(let i=0;i&lt;=2;i++){
          const value=ceiling*i/2, xx=x(value);
          if(i&gt;0 &amp;&amp; i&lt;2) svg.appendChild(el(&#x27;path&#x27;,{d:`M ${xx} ${top} V ${bottom}`,class:&#x27;grid&#x27;}));
          addText(svg,xx,bottom+17,value.toFixed(type===&#x27;memory&#x27;?0:1),i===0?&#x27;start&#x27;:i===2?&#x27;end&#x27;:&#x27;middle&#x27;);
        }
        addText(svg,left,13,type===&#x27;memory&#x27;?&#x27;PSS 峰值 / MiB&#x27;:&#x27;准备 + 播放&#x27;,&#x27;start&#x27;,{class:&#x27;axis-title&#x27;,&#x27;data-axis&#x27;:&#x27;y&#x27;});
        addText(svg,left+pw/2,h-2,type===&#x27;memory&#x27;?&#x27;内存 / MiB&#x27;:type===&#x27;cpu&#x27;?&#x27;累计 CPU / CPU·s&#x27;:&#x27;经过时间 / s&#x27;,&#x27;middle&#x27;,{class:&#x27;axis-title&#x27;,&#x27;data-axis&#x27;:&#x27;x&#x27;});
        modes.forEach((m,i)=&gt;{
          const yy=43+i*62;
          addText(svg,4,yy+11,m.name);
          const group=el(&#x27;g&#x27;,{style:`--mode-color:${m.color}`}); svg.appendChild(group);
          if(type===&#x27;memory&#x27;) {
            group.appendChild(el(&#x27;rect&#x27;,{x:left,y:yy,width:x(m.pss)-left,height:13,class:&#x27;measure&#x27;}));
            addText(svg,x(m.pss)+5,yy+11,m.pss.toFixed(1));
            addText(svg,left,yy+36,m.bitmap===null?&#x27;Bitmap：未采集&#x27;:`Bitmap：${m.bitmap.toFixed(2)} MiB`);
          } else {
            const a=type===&#x27;time&#x27;?m.load[pass]:m.cpuLoad[pass], b=type===&#x27;time&#x27;?m.play[pass]:m.cpuPlay[pass];
            group.appendChild(el(&#x27;rect&#x27;,{x:left,y:yy,width:x(a)-left,height:13,class:&#x27;measure&#x27;,&#x27;data-tooltip&#x27;:`准备：${a.toFixed(3)} ${type===&#x27;time&#x27;?&#x27;s&#x27;:&#x27;CPU·s&#x27;}`}));
            group.appendChild(el(&#x27;rect&#x27;,{x:x(a),y:yy,width:x(a+b)-x(a),height:13,class:&#x27;measure&#x27;,opacity:.36,&#x27;data-tooltip&#x27;:`播放：${b.toFixed(3)} ${type===&#x27;time&#x27;?&#x27;s&#x27;:&#x27;CPU·s&#x27;}`}));
            addText(svg,x(a+b)+5,yy+11,(a+b).toFixed(2));
            addText(svg,left,yy+36,`${a.toFixed(2)} + ${b.toFixed(2)} ${type===&#x27;time&#x27;?&#x27;s&#x27;:&#x27;CPU·s&#x27;}`);
          }
        });
      }
      function render(){
        root.querySelectorAll(&#x27;[data-flow]&#x27;).forEach(svg=&gt;drawFlow(svg,Number(svg.dataset.flow)));
        root.querySelectorAll(&#x27;[data-plot]&#x27;).forEach(svg=&gt;drawPlot(svg,svg.dataset.plot));
        root.querySelector(&#x27;[data-time-caption]&#x27;).textContent=pass===0?&#x27;首次：关闭模式准备更久；优化后接近原单次播放时长。&#x27;:&#x27;再次：两种开启模式仍需解码单次图；优化后消除额外拖慢。&#x27;;
        root.querySelector(&#x27;[data-cpu-caption]&#x27;).textContent=pass===0?&#x27;CPU：优化前 8.215 → 优化后 5.922 CPU·s；关闭为 6.158 CPU·s。&#x27;:&#x27;CPU：优化后 6.211 CPU·s，仍高于关闭的 4.336 CPU·s；省内存有重复解码成本。&#x27;;
      }
      select.addEventListener(&#x27;change&#x27;,()=&gt;{
        pass=Number(select.value);render();
        root.querySelector(&#x27;[data-announcement]&#x27;).textContent=pass===0?&#x27;已显示首次加载实测&#x27;:&#x27;已显示再次加载实测&#x27;;
        window.openai?.setWidgetState({modelContent:{...window.openai?.widgetState?.modelContent,comparisonPass:pass===0?&#x27;首次加载&#x27;:&#x27;再次加载&#x27;},privateContent:{...window.openai?.widgetState?.privateContent,comparisonPass:pass}}).catch(()=&gt;{});
      });
      const observer=new ResizeObserver(()=&gt;render());
      root.querySelectorAll(&#x27;[data-flows] &gt; section, [data-plots] &gt; section&#x27;).forEach(n=&gt;observer.observe(n));
      render();
    })();
  &lt;/script&gt;

  &lt;details class=&quot;text-small&quot; style=&quot;margin-top:12px&quot;&gt;

      &lt;dt&gt;窗口保留&lt;/dt&gt;&lt;dd&gt;未来帧不会在绘制当前帧后立即淘汰；当前显示帧也保留到替代帧绘制完成。&lt;/dd&gt;

    (()=&gt;{

      const ns=&#x27;http://www.w3.org/2000/svg&#x27;;
      const COUNT=12, DECODE=.16, HOLD=.42, VSYNC=.12, END=9;
      const initialTimes=[COUNT*DECODE,DECODE,4*DECODE];
      const oldJobs=Array.from({length:COUNT},(_,i)=&gt;i===0?{frame:i,start:0,end:DECODE}:{frame:i,start:DECODE+HOLD+(i-1)*(HOLD+DECODE+VSYNC),end:DECODE+HOLD+(i-1)*(HOLD+DECODE+VSYNC)+DECODE});
      const jobs=[
        Array.from({length:COUNT},(_,i)=&gt;({frame:i,start:i*DECODE,end:(i+1)*DECODE})),
        oldJobs,
        [...Array.from({length:4},(_,i)=&gt;({frame:i,start:i*DECODE,end:(i+1)*DECODE})),...Array.from({length:COUNT-4},(_,i)=&gt;({frame:i+4,start:4*DECODE+(i+1)*HOLD,end:4*DECODE+(i+1)*HOLD+DECODE}))]
