        <title id="svga-3.0.0-loading-cache-title">SVGA 3.0.0 加载与缓存流程</title>
        <desc id="svga-3.0.0-loading-cache-desc">统一加载器依次查询强 LRU 与弱索引，合并兼容来源并取得完整正文，再按摘要复用或解码资源，成功后按策略发布缓存并创建独立展示会话。</desc>
