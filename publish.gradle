// Apply to every independently consumable Android library; no remote repository is configured.
apply plugin: 'maven-publish'
group = 'com.opensource.svgaplayer'
version = '3.0.0-SNAPSHOT'
android {
    publishing { singleVariant('release') { withSourcesJar() } }
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = project.name == 'library' ? 'svga-core' : project.name
            }
        }
        repositories { maven { url = rootProject.layout.buildDirectory.dir('maven') } }
    }
}
